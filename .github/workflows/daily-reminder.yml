name: Daily Expense Reminder

on:
  schedule:
    - cron: "0 14 * * *" # 9 PM UTC+7 (Cambodia time)
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Check daily expense and notify
        run: node scripts/check-daily-expense.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_USER_UID: ${{ secrets.FIREBASE_USER_UID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
